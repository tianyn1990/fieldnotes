<!DOCTYPE html><html lang="zh-CN"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Harness · Fieldnotes</title><meta name="description" content="围绕 AI Harness 的相关记录。"><meta name="theme-color" content="#f8f6ef"><script>
      (() => {
        const key = 'fieldnotes.theme';
        const root = document.documentElement;
        const system = window.matchMedia('(prefers-color-scheme: dark)');
        const bar = document.querySelector('meta[name="theme-color"]');
        let preference = 'system';
        const validate = value => value === 'dark' || value === 'light' ? value : 'system';
        function apply() {
          root.dataset.theme = preference;
          const dark = preference === 'dark' || (preference === 'system' && system.matches);
          bar.content = dark ? '#21231f' : '#f8f6ef';
          const select = document.getElementById('theme-choice');
          if (select) select.value = preference;
        }
        function restore() {
          try { preference = validate(localStorage.getItem(key)); } catch {}
          apply();
        }
        restore();
        document.addEventListener('DOMContentLoaded', apply, { once: true });
        window.addEventListener('pageshow', event => { if (event.persisted) restore(); });
        system.addEventListener('change', apply);
        window.addEventListener('storage', event => {
          if (event.key === key || event.key === null) restore();
        });
        document.addEventListener('keydown', event => {
          if (event.target.id !== 'theme-choice' || !['Home', 'End'].includes(event.key)) return;
          event.preventDefault();
          const select = event.target;
          select.selectedIndex = event.key === 'Home' ? 0 : select.length - 1;
          select.dispatchEvent(new Event('change', { bubbles: true }));
        });
        document.addEventListener('change', event => {
          if (event.target.id !== 'theme-choice') return;
          preference = validate(event.target.value);
          try { localStorage.setItem(key, preference); } catch {}
          apply();
        });
      })();
